name: PizzaDronz CI
on:
  push:
    branches: ['**']

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 18
        distribution: temurin
        cache: maven
    - run: mvn test jacoco:report -B
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jacoco-report
        path: target/site/jacoco/
