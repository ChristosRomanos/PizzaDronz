name: PizzaDronz CI/CD - Tests and Coverage

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  test-and-coverage:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 18
      uses: actions/setup-java@v4
      with:
        java-version: 18
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean compile -B

    - name: Run Tests with Coverage
      run: |
        echo "::group::Running Tests"
        mvn test jacoco:report -B
        echo "::endgroup::"

    - name: Publish Detailed Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: '📊 JUnit Test Results'
        path: 'target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: false
        max-annotations: 50

    - name: Extract Test Details
      if: always()
      id: test_details
      run: |
        echo "## 🧪 Test Execution Details" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Parse test results from XML files
        if [ -d target/surefire-reports ]; then
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "| Test Class | Tests | Failures | Errors | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|----------|--------|------|" >> $GITHUB_STEP_SUMMARY
          
          for file in target/surefire-reports/TEST-*.xml; do
            if [ -f "$file" ]; then
              classname=$(grep -oP 'name="\K[^"]+' "$file" | head -1)
              tests=$(grep -oP 'tests="\K[0-9]+' "$file" | head -1)
              failures=$(grep -oP 'failures="\K[0-9]+' "$file" | head -1)
              errors=$(grep -oP 'errors="\K[0-9]+' "$file" | head -1)
              time=$(grep -oP 'time="\K[0-9.]+' "$file" | head -1)
              
              # Format class name for display
              shortname=$(echo "$classname" | sed 's/uk.ac.ed.inf.pizzadronz.//')
              
              # Determine status icon
              if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
                status="✅"
              else
                status="❌"
              fi
              
              echo "| $status $shortname | $tests | $failures | $errors | ${time}s |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Extract Coverage Metrics
      id: coverage
      if: always()
      run: |
        if [ -f target/site/jacoco/jacoco.csv ]; then
          TOTALS=$(tail -1 target/site/jacoco/jacoco.csv)
          IFS=',' read -ra METRICS <<< "$TOTALS"
          
          INST_MISSED=${METRICS[3]:-0}
          INST_COVERED=${METRICS[4]:-0}
          BRANCH_MISSED=${METRICS[5]:-0}
          BRANCH_COVERED=${METRICS[6]:-0}
          LINE_MISSED=${METRICS[7]:-0}
          LINE_COVERED=${METRICS[8]:-0}
          
          INST_TOTAL=$((INST_MISSED + INST_COVERED))
          BRANCH_TOTAL=$((BRANCH_MISSED + BRANCH_COVERED))
          LINE_TOTAL=$((LINE_MISSED + LINE_COVERED))
          
          # Calculate percentages with division by zero protection
          if [ $INST_TOTAL -gt 0 ]; then
            INST_PCT=$((INST_COVERED * 100 / INST_TOTAL))
          else
            INST_PCT=0
          fi
          
          if [ $BRANCH_TOTAL -gt 0 ]; then
            BRANCH_PCT=$((BRANCH_COVERED * 100 / BRANCH_TOTAL))
          else
            BRANCH_PCT=0
          fi
          
          if [ $LINE_TOTAL -gt 0 ]; then
            LINE_PCT=$((LINE_COVERED * 100 / LINE_TOTAL))
          else
            LINE_PCT=0
          fi
          
          echo "instruction_pct=$INST_PCT" >> $GITHUB_OUTPUT
          echo "branch_pct=$BRANCH_PCT" >> $GITHUB_OUTPUT
          echo "line_pct=$LINE_PCT" >> $GITHUB_OUTPUT
          echo "instruction_covered=$INST_COVERED" >> $GITHUB_OUTPUT
          echo "instruction_total=$INST_TOTAL" >> $GITHUB_OUTPUT
          echo "branch_covered=$BRANCH_COVERED" >> $GITHUB_OUTPUT
          echo "branch_total=$BRANCH_TOTAL" >> $GITHUB_OUTPUT
          echo "line_covered=$LINE_COVERED" >> $GITHUB_OUTPUT
          echo "line_total=$LINE_TOTAL" >> $GITHUB_OUTPUT
        else
          echo "instruction_pct=0" >> $GITHUB_OUTPUT
          echo "branch_pct=0" >> $GITHUB_OUTPUT
          echo "line_pct=0" >> $GITHUB_OUTPUT
          echo "instruction_covered=0" >> $GITHUB_OUTPUT
          echo "instruction_total=0" >> $GITHUB_OUTPUT
          echo "branch_covered=0" >> $GITHUB_OUTPUT
          echo "branch_total=0" >> $GITHUB_OUTPUT
          echo "line_covered=0" >> $GITHUB_OUTPUT
          echo "line_total=0" >> $GITHUB_OUTPUT
        fi

    - name: Generate Build Summary
      if: always()
      run: |
        echo "# 🚀 PizzaDronz CI/CD Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d target/surefire-reports ]; then
          TEST_COUNT=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          FAILURE_COUNT=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          ERROR_COUNT=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "errors=" {} \; | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          SKIPPED_COUNT=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "skipped=" {} \; | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          
          # Default to 0 if empty
          TEST_COUNT=${TEST_COUNT:-0}
          FAILURE_COUNT=${FAILURE_COUNT:-0}
          ERROR_COUNT=${ERROR_COUNT:-0}
          SKIPPED_COUNT=${SKIPPED_COUNT:-0}
          
          PASSED_COUNT=$((TEST_COUNT - FAILURE_COUNT - ERROR_COUNT - SKIPPED_COUNT))
          
          if [ $FAILURE_COUNT -eq 0 ] && [ $ERROR_COUNT -eq 0 ]; then
            TEST_STATUS="✅ All Tests Passed"
          else
            TEST_STATUS="❌ Tests Failed"
          fi
          
          echo "## $TEST_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ $TEST_COUNT -gt 0 ]; then
            PASSED_PCT=$((PASSED_COUNT * 100 / TEST_COUNT))
            FAILURE_PCT=$((FAILURE_COUNT * 100 / TEST_COUNT))
            ERROR_PCT=$((ERROR_COUNT * 100 / TEST_COUNT))
            SKIPPED_PCT=$((SKIPPED_COUNT * 100 / TEST_COUNT))
          else
            PASSED_PCT=0
            FAILURE_PCT=0
            ERROR_PCT=0
            SKIPPED_PCT=0
          fi
          
          echo "| Metric | Count | Percentage |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED_COUNT | ${PASSED_PCT}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILURE_COUNT | ${FAILURE_PCT}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Errors | $ERROR_COUNT | ${ERROR_PCT}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | $SKIPPED_COUNT | ${SKIPPED_PCT}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TEST_COUNT** | **100%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
        echo "| Type | Coverage | Target | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Instruction | ${{ steps.coverage.outputs.instruction_pct }}% (${{ steps.coverage.outputs.instruction_covered }}/${{ steps.coverage.outputs.instruction_total }}) | 80% | ${{ steps.coverage.outputs.instruction_pct >= 80 && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | ${{ steps.coverage.outputs.branch_pct }}% (${{ steps.coverage.outputs.branch_covered }}/${{ steps.coverage.outputs.branch_total }}) | 75% | ${{ steps.coverage.outputs.branch_pct >= 75 && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Line | ${{ steps.coverage.outputs.line_pct }}% (${{ steps.coverage.outputs.line_covered }}/${{ steps.coverage.outputs.line_total }}) | 80% | ${{ steps.coverage.outputs.line_pct >= 80 && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 Download Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 **JaCoCo HTML Report**: \`jacoco-coverage-report\`" >> $GITHUB_STEP_SUMMARY
        echo "- 🧪 **JUnit Test Results**: \`junit-test-results\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload JaCoCo Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-test-results
        path: target/surefire-reports/
        retention-days: 30

    - name: Add PR Comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const instPct = '${{ steps.coverage.outputs.instruction_pct }}';
          const branchPct = '${{ steps.coverage.outputs.branch_pct }}';
          const linePct = '${{ steps.coverage.outputs.line_pct }}';
          
          const comment = `## 📊 CI/CD Report - ${{ github.sha }}
          
          ### Code Coverage
          | Type | Coverage | Target | Status |
          |------|----------|--------|--------|
          | **Instruction** | ${instPct}% | 80% | ${instPct >= 80 ? '✅' : '⚠️'} |
          | **Branch** | ${branchPct}% | 75% | ${branchPct >= 75 ? '✅' : '⚠️'} |
          | **Line** | ${linePct}% | 80% | ${linePct >= 80 ? '✅' : '⚠️'} |
          
          📁 [View Full Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          *Automated CI/CD Report • JaCoCo Coverage*`;
          
          try {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not post PR comment:', error.message);
          }
