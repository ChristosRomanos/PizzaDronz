name: PizzaDronz CI - Tests and Coverage
on:
  push:
    branches: [ '**' ]  # Run on all branches
  pull_request:
    branches: [ '**' ]
jobs:
  test-and-coverage:
    name: Tests and Coverage Report
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up JDK 18
      uses: actions/setup-java@v4
      with:
        java-version: 18
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean compile -B
    - name: Run Tests with Coverage
      run: mvn test jacoco:report -B
    - name: Check Coverage Thresholds
      run: mvn jacoco:check
      continue-on-error: true
    - name: Upload JaCoCo Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/
        retention-days: 30
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 30
    - name: Display Coverage Summary
      if: always()
      run: |
        echo "## 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Coverage report has been generated and uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the 'jacoco-report' artifact to view the full HTML coverage report." >> $GITHUB_STEP_SUMMARY
        # Try to extract coverage if jacoco.csv exists
        if [ -f target/site/jacoco/jacoco.csv ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Details" >> $GITHUB_STEP_SUMMARY
          echo '`' >> $GITHUB_STEP_SUMMARY
          head -5 target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          echo '`' >> $GITHUB_STEP_SUMMARY
        fi
